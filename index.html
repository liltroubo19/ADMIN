google.charts.load('current', {packages:['corechart']});
google.charts.setOnLoadCallback(function(){

  const container = document.getElementById('cards');

  DATA.forEach((cat, idx) => {
    const chartId = 'chart_' + idx;

    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML = `
      <div class="q-header">
        <div class="q-title">${cat.title}</div>
        <button class="copy-btn" id="copybtn_${idx}" onclick="copyData(${idx})">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Copy
        </button>
      </div>
      <div class="q-count">${cat.responses.toLocaleString()} responses</div>
      <div class="chart-div" id="${chartId}"></div>
    `;
    container.appendChild(card);

    // Build data table with actual percentages + vote counts (HTML tooltip)
    const rows = cat.candidates.map(c => {
      const votes = Math.round((c.pct / 100) * cat.responses);
      const tip = `<div style="padding:10px 14px;font-family:Roboto,Arial,sans-serif;min-width:160px">
        <div style="font-size:12px;color:#5f6368;margin-bottom:6px">${c.name}</div>
        <div style="font-size:15px;font-weight:700;color:#202124">${votes.toLocaleString()} (${c.pct}%)</div>
      </div>`;
      return [c.name, c.pct, tip];
    });
    const tableData = new google.visualization.DataTable();
    tableData.addColumn('string', 'Candidate');
    tableData.addColumn('number', 'Percentage');
    tableData.addColumn({type:'string', role:'tooltip', p:{html:true}});
    tableData.addRows(rows);

    const colors = cat.candidates.map(c => COLOR_MAP[c.color] || "#999");

    // Taller chart for many candidates
    const chartEl = document.getElementById(chartId);
    if (cat.candidates.length > 5) {
      chartEl.style.height = (200 + cat.candidates.length * 18) + 'px';
    }

    const options = {
      legend: {
        position: 'right',
        alignment: 'center',
        textStyle: { fontSize: 11, color: '#202124' }
      },
      pieSliceText: 'percentage',
      pieSliceTextStyle: { fontSize: 12, bold: true, color: '#ffffff' },
      chartArea: { left: 10, top: 10, width: '55%', height: '90%' },
      colors: colors,
      backgroundColor: 'transparent',
      enableInteractivity: true,
      tooltip: { isHtml: true }
    };

    const chart = new google.visualization.PieChart(document.getElementById(chartId));
    chart.draw(tableData, options);
  });
});

function copyData(idx){
  const cat = DATA[idx];
  const txt = cat.candidates.map(c => `${c.name}: ${c.pct}%`).join('\n');
  navigator.clipboard.writeText(`${cat.title}\nResponses: ${cat.responses.toLocaleString()}\n${txt}`).then(() => {
    const btn = document.getElementById('copybtn_' + idx);
    btn.innerHTML = '✓ Copied';
    setTimeout(() => {
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012 2v1"/></svg> Copy`;
    }, 1800);
  });
}
